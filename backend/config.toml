# NutrientLog settings you can tune. This file is committed, so it never holds secrets
# (keys and passwords go in the .env file). A test checks every value here is in a sensible range.
# Formulas and science (7,700 kcal per kg, Mifflin-St Jeor, unit conversions) stay in the code.

[ranking]
# How search results are ordered (calc in app/calc/food_rank.py). Run scripts/search_check.py
# after changing any of these.
coverage = 100.0          # share of the typed words found in the name or brand
all_found = 30.0          # every typed word found
name_only = 10.0          # share of the typed words found in the name itself
brand_and_name = 15.0     # brand words in the brand, the rest in the name ("clif" + "bar")
exact_name = 20.0         # a curated food named exactly as typed, in any order ("Milk, whole")
plural_head = 8.0         # one typed word, and a curated name starting with its plural ("Eggs, ...")
starts_with = 8.0         # the name begins with the first typed word
generic_food = 15.0       # short query and a curated plain food ("banana", "flour")
plain_word = 8.0          # a plain food whose name says raw / cooked / plain / fresh
extra_word = 1.5          # penalty per name word that was not typed
extra_cap = 20.0          # most that extra words can cost
energy_mismatch = 30.0    # penalty when the calories disagree with protein, carbs and fat
has_serving = 3.0         # bonus for having a named serving
source_order = 5.0        # the source's own relevance, as a tiebreaker (fades over 50 places)
close_word = 0.8          # credit for a typed word that is the start of a name word ("banan")
plural_only = 0.9         # credit when a typed plural only matches a singular
typo_word = 0.7           # credit for a word one letter off ("chiken")

[search]
saved_limit = 25               # saved foods shown per search
source_limit = 50              # results asked of each outside database, per page
enough_full_matches = 5        # fewer close matches than this: also ask the fallback database
long_query_words = 3           # queries this long also ask the fallback database
min_query_length = 2
max_query_length = 100
timeout_seconds = 5.0          # how long one request to an outside database may take
deadline_seconds = 4.0         # a search answers by now with whatever has arrived (slow ones are skipped)
cache_seconds = 600.0          # an identical search is answered from memory for this long
usda_generic_limit = 60        # plain foods asked of USDA per search
usda_loose_below = 10          # fewer strict USDA matches than this: also look for partial matches
usda_retry_waits = [1.0, 3.0]  # seconds to wait before each retry
off_retry_waits = [1.0, 2.0]
off_cooldown_seconds = 60.0    # Open Food Facts is not asked again for this long after failing

[food]
# Limits on a food a person saves by hand.
max_name_length = 200
max_brand_length = 100
max_servings = 20
max_serving_grams = 5000.0
max_serving_label_length = 60

[portions]
# Rough sizes for "how much did you eat?" when nobody weighed it. Bowls and plates are volumes in
# US cups, so they only apply to foods whose weight per cup is known. "Small/large portion" scale
# the food's own serving, for foods where a cup is unknown.
small_bowl_cups = 0.5
medium_bowl_cups = 1.0
large_bowl_cups = 1.75
small_plate_cups = 1.5
medium_plate_cups = 2.5
large_plate_cups = 3.5
small_portion_factor = 0.5
large_portion_factor = 1.5

[workouts]
# Calories burned by a logged workout = (MET - 1) x body weight (kg) x hours x intensity factor.
# MET says how hard an activity is compared with sitting still; the "- 1" leaves out the resting
# burn, which the app already counts separately. A person can type the calories instead (for
# example from a watch). Values are standard figures from the Compendium of Physical Activities.
# `short` is the few letters shown on a calendar day.
intensity_light = 0.8
intensity_moderate = 1.0
intensity_hard = 1.25
max_minutes = 600
max_calories = 5000.0

[[workouts.activities]]
key = "walking"
label = "Walking"
short = "Walk"
met = 3.5

[[workouts.activities]]
key = "running"
label = "Running"
short = "Run"
met = 9.8

[[workouts.activities]]
key = "cycling"
label = "Cycling"
short = "Bike"
met = 7.5

[[workouts.activities]]
key = "swimming"
label = "Swimming"
short = "Swim"
met = 6.0

[[workouts.activities]]
key = "weights"
label = "Weight training"
short = "Lift"
met = 5.0

[[workouts.activities]]
key = "hiit"
label = "HIIT / circuit"
short = "HIIT"
met = 8.0

[[workouts.activities]]
key = "sports"
label = "Sports (ball games)"
short = "Sport"
met = 7.0

[[workouts.activities]]
key = "hiking"
label = "Hiking"
short = "Hike"
met = 6.0

[[workouts.activities]]
key = "yoga"
label = "Yoga / stretching"
short = "Yoga"
met = 2.5

[[workouts.activities]]
key = "other"
label = "Other exercise"
short = "Other"
