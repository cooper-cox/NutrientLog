[goals]
# Calorie-target policy (the formulas themselves are in app/calc/goals.py).
max_gain_kg_per_week = 0.5
max_lose_kg_per_week = 1.0
protein_g_per_kg = 1.8
max_protein_fraction = 0.35
fat_fraction = 0.25

[goals.activity]
sedentary = 1.2
light = 1.375
moderate = 1.55
very_active = 1.725
extra_active = 1.9

[goals.calorie_floor]
male = 1500
female = 1200
no_answer = 1350

[profile]
# Height and weight that cannot both be right.
min_plausible_bmi = 14.0
max_plausible_bmi = 80.0
min_goal_bmi_when_losing = 18.5
max_goal_bmi = 45.0
