name: backend-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutrientlog
          POSTGRES_PASSWORD: nutrientlog
          POSTGRES_DB: nutrientlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrientlog -d nutrientlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://nutrientlog:nutrientlog@localhost:5432/nutrientlog

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type-check (mypy)
        run: mypy app migrations tests

      - name: Unit tests
        run: pytest tests/unit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Integration tests
        run: pytest tests/integration

      - name: Build Docker image
        run: docker build -t nutrientlog-backend .
