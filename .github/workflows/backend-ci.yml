name: backend-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutrientlog
          POSTGRES_PASSWORD: nutrientlog
          POSTGRES_DB: nutrientlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrientlog -d nutrientlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database that exists only on this CI machine, so this is not a real secret.
      DATABASE_URL: postgresql+psycopg://nutrientlog:nutrientlog@localhost:5432/nutrientlog

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type-check (mypy)
        run: mypy app migrations tests

      - name: Unit tests
        run: pytest tests/unit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check

      - name: Integration tests
        run: pytest tests/integration

      - name: Build Docker image
        run: docker build -t nutrientlog-backend .

  # Starts the real thing the way the README does (docker compose) and asks it if it is healthy.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make a throwaway .env
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env

      - name: Start the database and the API
        run: docker compose up -d --build

      - name: Wait for the API to answer, then check the database connection
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health/db; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Stop everything
        if: always()
        run: docker compose down -v
