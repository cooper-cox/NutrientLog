name: mobile-ci

on:
  push:
  pull_request:

jobs:
  # The job is named "mobile" so branch protection can require a check with that name.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Tests (jest)
        run: npm test -- --ci
      - name: Check the app bundles for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
