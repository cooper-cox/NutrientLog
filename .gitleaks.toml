# Settings for the secret scanner (gitleaks), which runs on every push.
# It starts from gitleaks' standard rules and adds one exception.
[extend]
useDefault = true

[allowlist]
description = "'nutrient_key' and the nutrient list on the phone ('key: \"vitamin_c_mg\", label: ...') name nutrients, not secret keys"
regexTarget = "line"
regexes = [
  '''nutrient_key''',
  '''key:\s*"[a-z0-9_]+",\s*label:''',
]
